<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secret Access</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2d1f, #2f4f3f);
      font-family: Arial, sans-serif;
    }

    .container {
      background: #f5efe4;
      padding: 40px 30px;
      border-radius: 20px;
      width: min(90%, 500px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 20px;
      color: #1f3b2f;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #c9bfae;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4d7a5a;
    }

    .error {
      margin-top: 10px;
      color: #a12d2d;
      font-size: 14px;
      height: 18px;
    }

    .image-container {
      margin-top: 20px;
      display: none;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .image-container img {
      width: 48%;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Enter Secret Code</h1>
    <input type="password" id="codeInput" placeholder="Type code..." />
    <div class="error" id="errorText"></div>

    <div class="image-container" id="imageContainer">
      <img src="sigma.png" alt="Sigma Image 1" />
      <img src="sigma2.png" alt="Sigma Image 2" />
    </div>
  </div>

  <script>
    const input = document.getElementById("codeInput");
    const errorText = document.getElementById("errorText");
    const imageContainer = document.getElementById("imageContainer");

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        const value = input.value.trim().toLowerCase();

        if (value === "sigma") {
          errorText.textContent = "";
          imageContainer.style.display = "flex";
        } else {
          imageContainer.style.display = "none";
          errorText.textContent = "Wrong code";
        }
      }
    });
  </script>
</body>
</html>
